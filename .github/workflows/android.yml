name: Android CI/CD with Fastlane

# Kích hoạt tự động khi có code mới hoặc cho phép chạy thủ công từ bất kỳ nhánh nào
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch: # Thêm dòng này để cho phép nhấn nút Run Workflow thủ công trên web GitHub

jobs:
  distribute_android:
    runs-on: ubuntu-latest

    steps:
      # 1. Tải code từ Github về server ảo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cài đặt môi trường Java (Bắt buộc để build Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Cài đặt Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Tự động lấy phiên bản flutter dựa trên cấu hình pubspec.yaml của bạn
          cache: true

      # 4. Tải các gói thư viện Dart/Flutter
      - name: Install dependencies
        run: flutter pub get

      # 4.5. Tự động tạo lại các file *.g.dart và *.freezed.dart bằng build_runner
      - name: Generate code files
        run: dart run build_runner build --delete-conflicting-outputs

      # 5. Cài đặt Ruby và Bundler (Để chạy Fastlane)
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0' # Hoặc phiên bản Ruby bạn muốn dùng
          bundler-cache: true
          working-directory: android

      # 6. Tạo lại file JSON Key bảo mật từ GitHub Secrets
      - name: Create Firebase Service Account Key file
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > android/fastlane/firebase-credentials.json

      # 6.5. Tạo lại file .env.dev từ GitHub Secrets (vì file này bị .gitignore chặn)
      - name: Create env.dev file
        run: |
          echo '${{ secrets.ENV_DEV }}' > .env.dev

      # 7. Chạy Fastlane để tự build APK & Deploy lên Firebase
      - name: Run Fastlane Android Deploy
        run: |
          cd android
          bundle exec fastlane android distribute_firebase env:dev
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: "fastlane/firebase-credentials.json"
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          FIREBASE_GROUPS: ${{ secrets.FIREBASE_GROUPS }}

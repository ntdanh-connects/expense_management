name: Android CI/CD with Fastlane

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  distribute_android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
          working-directory: android

      - name: Create Firebase Service Account Key file
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > android/fastlane/firebase-credentials.json

      - name: Create env.dev file
        run: |
          echo '${{ secrets.ENV_DEV }}' > .env.dev

      - name: Decode Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          python3 -c "import base64, os; data = base64.b64decode(os.environ['RELEASE_KEYSTORE_BASE64']); open('android/app/release-keystore.jks', 'wb').write(data)"

      # GHA tự build APK (có Flutter, có .env.dev rồi)
      - name: Build APK
        run: flutter build apk --release --dart-define-from-file=.env.dev

      # Fastlane chỉ lo distribute, không build nữa
      - name: Run Fastlane Android Deploy
        run: |
          cd android
          bundle exec fastlane android distribute_firebase
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: "fastlane/firebase-credentials.json"
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          FIREBASE_GROUPS: ${{ secrets.FIREBASE_GROUPS }}